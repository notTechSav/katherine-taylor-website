        with:
          name: Vercel - katherine-taylor-website:routing-integrity

      - name: Notify Vercel - metadata-complete
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:metadata-complete

      - name: Notify Vercel - robots-sitemap
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:robots-sitemap

      - name: Notify Vercel - manifest-check
