name: Notify Vercel statuses

on:
  workflow_dispatch: # Trigger manually for now

jobs:
  notify-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Vercel - lint
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:lint

      - name: Notify Vercel - typecheck
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:typecheck

      - name: Notify Vercel - build
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:build

      - name: Notify Vercel - test
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:test

      - name: Notify Vercel - e2e
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:e2e

      - name: Notify Vercel - SEO audit
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - katherine-taylor-website:SEO audit

      - name: Notify Vercel - accessibility
